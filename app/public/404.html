<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Off the dial · Cosmic Radio</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; align-items: end; padding: 40px 24px; box-sizing: border-box;
        background: radial-gradient(70% 60% at 72% 40%, hsl(36 40% 30% / 0.18), transparent 70%), #0a0c10;
        color: #e7e9ef; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 1240px; width: 100%; margin: 0 auto; }
      p.k { margin: 0 0 10px; font-variant-caps: all-small-caps; letter-spacing: 0.09em; font-weight: 500; color: #dbb276; }
      h1 { margin: 0 0 16px; font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-weight: 500; font-size: clamp(2.6rem, 11vw, 6rem); line-height: 0.92; letter-spacing: -0.03em; }
      p.l { max-width: 36ch; margin: 0 0 28px; color: #9aa1b0; line-height: 1.6; }
      a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; border-radius: 12px; background: #dbb276; color: #1d150a; font-weight: 600; text-decoration: none; transition: transform 0.2s cubic-bezier(0.34, 1.4, 0.64, 1); }
      a:hover { transform: translateY(-2px); }
      a:active { transform: scale(0.98); }
      a:focus-visible { outline: 2px solid #f4ecdf; outline-offset: 3px; }
      @media (min-width: 900px) { body { align-items: center; padding-inline: 64px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="k">Error 404</p>
      <h1>Off the dial.</h1>
      <p class="l">There’s no station at this address. The page may have moved, or the link was cut short.</p>
      <a href="/">Back to the receiver</a>
    </main>
  </body>
</html>
