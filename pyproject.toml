[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony"
version = "0.1.0"
description = "Hear the symphony of space: sonification of orbits, pulsars, plasma waves, black holes and gravitational waves."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
symphony = "symphony.cli:main"

[tool.setuptools.packages.find]
include = ["symphony*"]
